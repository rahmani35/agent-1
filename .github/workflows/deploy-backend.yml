name: Deploy Gateway to Google Cloud Run

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'agent/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: learn-agent-deployment
  REGION: europe-west3
  SERVICE_NAME: agent1-backend

jobs:
  deploy-backend:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars "^##^GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}##GOOGLE_CLOUD_REGION=${{ env.REGION }}##MODEL_NAME=gemini-3.6-flash##EMBEDDING_MODEL=gemini-embedding-001##VECTOR_BACKEND=${{ vars.VECTOR_BACKEND || 'cloudsql' }}##FIRESTORE_COLLECTION=document_chunks##DB_HOST=${{ secrets.DB_HOST || 'db.tquxueaqmmldatsagqzp.supabase.co' }}##DB_PORT=${{ secrets.DB_PORT || '5432' }}##DB_NAME=${{ secrets.DB_NAME || 'postgres' }}##DB_USER=${{ secrets.DB_USER || 'postgres' }}##DB_PASS=${{ secrets.DB_PASS }}##DB_SSLMODE=require##ALLOWED_USERS=${{ secrets.ALLOWED_USERS || 'iman.rahmani@gmail.com' }}##GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '537728611405-cgtolhfqij6fj514dbkjfv8atiqr4f6b.apps.googleusercontent.com' }}##GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
