name: Deploy RAG Agent to Vertex AI Agent Engine

on:
  push:
    branches: [ main ]
    paths:
      - 'agent/**'
      - '.github/workflows/deploy-agent.yml'
  workflow_dispatch:

env:
  PROJECT_ID: learn-agent-deployment
  REGION: europe-west3
  STAGING_BUCKET: gs://learn-agent-deployment-staging

jobs:
  deploy-agent:
    name: Deploy RAG Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'agent/requirements.txt'

      - name: Install Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Deploy to Agent Engine
        run: |
          python agent/deploy.py \
            --action deploy \
            --project ${{ env.PROJECT_ID }} \
            --location ${{ env.REGION }} \
            --bucket ${{ env.STAGING_BUCKET }} \
            --name rag-document-agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_NAME: gemini-3.6-flash
          EMBEDDING_MODEL: gemini-embedding-001
          VECTOR_BACKEND: firestore
          FIRESTORE_COLLECTION: document_chunks
          FIRESTORE_DATABASE: "(default)"
