name: Deploy RAG Agent to Vertex AI Agent Engine

on:
  push:
    branches: [ main ]
    paths:
      - 'agent/**'
      - '.github/workflows/deploy-agent.yml'
  workflow_dispatch:

env:
  PROJECT_ID: learn-agent-deployment
  REGION: europe-west3
  STAGING_BUCKET: gs://learn-agent-deployment-staging

jobs:
  deploy-agent:
    name: Deploy RAG Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'agent/requirements.txt'

      - name: Install Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Deploy to Agent Engine
        run: |
          python agent/deploy.py \
            --action deploy \
            --project ${{ env.PROJECT_ID }} \
            --location ${{ env.REGION }} \
            --bucket ${{ env.STAGING_BUCKET }} \
            --name rag-document-agent
        env:
          # No GEMINI_API_KEY: the Agent Engine container authenticates with its
          # own service account. An API key here would be promoted to
          # GOOGLE_API_KEY inside the agent and break the session service.
          MODEL_NAME: gemini-3.6-flash
          EMBEDDING_MODEL: gemini-embedding-001
          # Must match the gateway's backend, or chat answers come from a
          # different corpus than the one uploads are written to.
          VECTOR_BACKEND: ${{ vars.VECTOR_BACKEND || 'cloudsql' }}
          FIRESTORE_COLLECTION: document_chunks
          FIRESTORE_DATABASE: "(default)"
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_SSLMODE: require
